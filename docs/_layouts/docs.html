---
layout: none
---
<!DOCTYPE html>
<html lang="{{ site.lang | default: "zh-CN" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("zh-theme");
          var theme = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
    {% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body>
    <div class="zh-shell">
      <button class="zh-toggle" id="zh-toggle" type="button" aria-label="切换导航">目录</button>
      <aside class="zh-sidebar" id="zh-sidebar">
        <a class="zh-brand" href="{{ site.baseurl }}/">Google 风格指南 · 中文</a>
        <button class="zh-theme-toggle" id="zh-theme-toggle" type="button" aria-label="切换主题">
          <svg class="zh-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="zh-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <span class="zh-theme-label">深色</span>
        </button>
        <div class="zh-search">
          <input id="zh-search-input" type="search" placeholder="搜索指南…" autocomplete="off" aria-label="站内搜索">
          <ul id="zh-search-results" class="zh-results"></ul>
        </div>
        {% include sidebar.html %}
        <div class="zh-legal">
          <p>非官方中文翻译，规范以 <a href="https://github.com/google/styleguide">英文原文</a> 为准。</p>
          <p>原文文档 <a href="https://creativecommons.org/licenses/by/3.0/">CC BY 3.0</a>；代码示例 Apache 2.0。</p>
          <p>对应上游提交 <code>7237268</code>（2026-11-09）。</p>
        </div>
      </aside>
      <main class="zh-main markdown-body" id="zh-main">
        {{ content }}
      </main>
      <aside class="zh-toc" id="zh-toc" aria-label="本页目录"></aside>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/anchor-js/4.1.0/anchor.min.js" integrity="sha256-lZaRhKri35AyJSypXXs4o6OPFTbTmUoltBbDCbdzegg=" crossorigin="anonymous"></script>
    <script>anchors.add();</script>
  </body>
</html>
